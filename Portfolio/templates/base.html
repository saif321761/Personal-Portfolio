<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BASE PAGE</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.5.0/font/bootstrap-icons.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap-icons/1.10.5/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
</head>

</head>

<style>
    *{
        margin: 0;
        padding: 0;
    }

    body {
        font-family: 'Poppins', sans-serif;
    }

    html{
        scroll-behavior: smooth;
    }

    p{
        color: rgb(85, 85, 85);
    }

    a, .btn{
        transition: all 300ms ease;
    }

    nav, .nav-links{
        display: flex;
    }

    nav{
        justify-content: space-around;
        align-items: center;
        height: 15vh;
    }

    .nav-links{
        list-style: none;
        gap: 2rem;
        font-size: 1.5rem;
    }

    a{
        color: black;
        text-decoration: none;
        text-decoration-color: white;
    }

    a:hover{
        color: gray;
        text-decoration: underline;
        text-underline-offset: 1rem;
        text-decoration-color: rgb(181, 181, 181);
    }

    .logo{
        font-size: 2rem;
    }

    .logo:hover{
        cursor: default;
    }

    #hamburger-nav{
        display:none;
    }

    .hamburger-menu{
        display: inline-block;
        position: relative;
    }

    .hamburger-icon{
        display: flex;
        flex-direction: column;
        justify-content: space-between;
        height: 24px;
        width: 30px;
        cursor: pointer;
    }

    .hamburger-icon span {
        width: 100%;
        height: 2px;
        background-color: black;
        transition: all 0.3 ease-in-out;
    }

    .menu-links{
        position: absolute;
        top: 100%;
        right: 0%;
        background-color: white;
        width: fit-content;
        max-height: 0;
        overflow: hidden;
        transition: all 0.3 ease-in-out;
    }

    .menu-links a{
        display: block;
        padding: 10px;
        text-align: center;
        font-size: 1.5rem;
        color: black;
        text-decoration: none;
        transition: all 0.3 ease-in-out;
    }

    .menu-links li{
        list-style: none;
    }

    .menu-links.open{
        max-height: 300px;
    }

    .hamburger-icon.open span:first-child{
        transform: rotate(45deg) translate(10px,5px);
    }


    .hamburger-icon.open span:nth-child(2){
        opacity: 0;
    }

    .hamburger-icon.open span:last-child{
        transform: rotate(-45deg) translate(10px,-5px);
    }

    .hamburger-icon span:first-child{
        transform: none;
    }

    .hamburger-icon span:first-child{
        opacity: 1;
    }

    .hamburger-icon span:first-child{
        transform: none;
    }


    @media screen and (max-width:1200px){
        #desktop-nav{
            display: none;
        }

        #hamburger-nav{
            display: flex;
        }
    }


    .hero-section {
        display: flex;
        justify-content: center;
        align-items: center;
        padding: 8rem 20px;
        text-align: center;
        background: linear-gradient(118deg, #ffffff36, #d1fff373);
        color: #fff;
    }

    .hero-section-content {
        display: flex;
        flex-direction: row;
        align-items: center;
        gap: 3rem;
        max-width: 1000px;
    }

    .profile-pic {
        width: 400px;
        height: 400px;
        border-radius: 50%;
        border: 2px solid #fff;
        box-shadow: 0px 10px 20px rgba(0, 0, 0, 0.2);
    }

    .intro-content p {
        font-size: 18px;
        color: black;
        margin-bottom: 5px;
    }

    .intro-content h1 {
        font-size: 48px;
        margin: 10px 0;
        font-weight: 700;
        color: black;
    }

    .intro-content h2 {
        font-size: 24px;
        color: black;
        margin-bottom: 20px;
    }

    .buttons a {
        --c: black;
        
        box-shadow: 0 0 0 .1em inset black;
        --_g: linear-gradient(var(--c) 0 0) no-repeat;
        background: 
            var(--_g) calc(var(--_p, 0%) - 100%) 0%,
            var(--_g) calc(200% - var(--_p, 0%)) 0%,
            var(--_g) calc(var(--_p, 0%) - 100%) 100%,
            var(--_g) calc(200% - var(--_p, 0%)) 100%;
        background-size: 50.5% calc(var(--_p, 0%) / 2 + .5%);
        outline-offset: .1em;
        transition: background-size .4s, background-position 0s .4s;
        
        text-decoration: none;
        padding: 12px 30px;
        border-radius: 30px;
        font-weight: bold;
        font-size: 16px;
        color: darkgrey;
        display: inline-block;
    }

    .buttons a:hover {
        --_p: 100%;
        transition: background-position .4s, background-size 0s;
    }

    .buttons a:active {
        box-shadow: 0 0 9em inset #0009; 
        background-color: var(--c);
        color: #fff;
    }


    .social-icons {
        display: flex;
        gap: 20px;
        margin-top: 15px;
        align-items: center;
        justify-content: center;
        margin-top: 16px;
    }

    .social-icons a {
        display: inline-block;
        width: 50px;
        height: 50px;
        margin: 0 10px;
        background-color: black; /* Background color for icons */
        color: #fff; /* Icon color */
        border-radius: 50%; /* Circular shape */
        display: flex;
        align-items: center;
        justify-content: center;
        text-decoration: none;
        transition: background-color 0.3s, transform 0.3s;
        font-size: 24px;
    }


    .social-icons a:hover {
        background-color: #1a705d;
        transform: scale(1.1);
    }

</style>
<body>
    <nav id="desktop-nav">
        <div class="logo">Saif Dev</div>
        <div>
            <ul class="nav-links">
                <li><a href="">About</a></li>
                <li><a href="">Experience</a></li>
                <li><a href="">Projects</a></li>
                <li><a href="{% url 'contacUs' %}">Contact us</a></li>
            </ul>
        </div>
    </nav>

    <nav id="hamburger-nav">
        <div class="logo">Saif Dev</div>
        <div class="hamburger-menu">
            <div class="hamburger-icon" onclick="toggleMenu()">
                <span></span>
                <span></span>
                <span></span>
            </div>
            <div class="menu-links">
                <li><a href="#about" onclick="toggleMenu()">About</a></li>
                <li><a href="#experience" onclick="toggleMenu()">Experience</a></li>
                <li><a href="#projects" onclick="toggleMenu()">Projects</a></li>
                <li><a href="#contact" onclick="toggleMenu()">Contact</a></li>
            </div>  
        </div>
    </nav>

    <section class="hero-section">
        <div class="hero-section-content">
            <img src="../static/images/1704222119348-Photoroom.jpg" alt="" class="profile-pic">
            <div class="intro-content">
                <p>Hello, I'm</p>
                <h1>Saif ud din</h1>
                <h2>Full Stack Developer</h2>
                <div class="buttons">
                    <a href="../static/files/Saif ud din Full-Stack-Developer.pdf">Download Cv</a>
                    <a href="#conatct">Contact Info</a>
                </div>
                <div class="social-icons">
                    <a href="#"><i class="bi bi-linkedin"></i></a>
                    <a href="#"><i class="bi bi-github"></i></a>
                </div>
            </div>
        </div>
    </section>

    {% block content%}

    {% endblock %}
</body>

<script>
    function toggleMenu(){
        const menu = document.querySelector('.menu-links');
        const icon = document.querySelector('.hamburger-icon');

        menu.classList.toggle("open");
        icon.classList.toggle("open");
    }
</script>
</html>
